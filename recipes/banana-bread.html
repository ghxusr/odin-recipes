    <img src="../images/banana-bread.jpg" alt="Image of banana bread loaf on a slate board" height="310" width="310">

    <h2>Description</h2>

    <p>A versatile an quick to prepare banana bread</p>

    <h3>Ingredients</h3>

    <p>
        <ul>
            <li>1 cup white sugar</li>
            <li>0.5 cup margarine, softened</li>
            <li>2 eggs</li>
            <li>1.5 cups mashed banana</li>
            <li>2 cups all-purpose flour</li>
            <li>1 teaspoon baking soda</li>
        </ul>
    </p>
